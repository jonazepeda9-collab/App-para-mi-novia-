<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#050005;overflow:hidden;touch-action:none}
  canvas{display:block}
  #title{position:fixed;top:4%;width:100%;text-align:center;color:#fff;font:3rem 'Great Vibes',cursive;
    text-shadow:0 0 15px #ff4d6d;pointer-events:none}
  #hint{position:fixed;bottom:3%;width:100%;text-align:center;color:#ffb3c1;font:.9rem sans-serif;pointer-events:none;opacity:.8}
  #viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:10}
  #viewer.on{display:flex}
  #viewer img{max-width:92vw;max-height:86vh;border-radius:14px;box-shadow:0 0 40px #ff4d6d;animation:pop .35s ease}
  #viewer span{position:absolute;top:16px;right:22px;color:#fff;font:2rem sans-serif;cursor:pointer}
  @keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="title">Para ti 💖</div>
<div id="hint">Arrastra para girar · Toca una foto para verla en grande</div>
<div id="viewer"><span>✕</span><img alt=""></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

/* ====== TUS FOTOS ======
   Sube tus fotos a la carpeta "fotos/" y agrega aquí sus nombres.
   Mientras no existan, se muestran planetas de ejemplo con corazón. */
const FOTOS = [
  'fotos/1.jpg','fotos/2.jpg','fotos/3.jpg','fotos/4.jpg','fotos/5.jpg','fotos/6.jpg',
  'fotos/7.jpg','fotos/8.jpg','fotos/9.jpg','fotos/10.jpg','fotos/11.jpg','fotos/12.jpg'
];

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const glow = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'#fff'); gr.addColorStop(.4,'rgba(255,255,255,.5)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
})();

function points(positions, colors, size) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    size, map: glow, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
}

/* Estrellas de fondo */
{
  const p = [], c = [];
  for (let i = 0; i < 2500; i++) {
    const r = 90 + Math.random()*200, t = Math.random()*6.283, ph = Math.acos(2*Math.random()-1);
    p.push(r*Math.sin(ph)*Math.cos(t), r*Math.cos(ph), r*Math.sin(ph)*Math.sin(t));
    const b = .4 + Math.random()*.6; c.push(b, b*.7, b*.8);
  }
  scene.add(points(p, c, 1.5));
}

/* Disco espiral del agujero negro */
const disk = (() => {
  const p = [], c = [], col = new THREE.Color();
  for (let i = 0; i < 22000; i++) {
    const r = 4 + Math.pow(Math.random(), 1.6) * 30;
    const arm = (i % 3) * 2.094 + r * 0.35 + (Math.random()-.5) * .6;
    p.push(Math.cos(arm)*r, (Math.random()-.5) * (1 + r*.04), Math.sin(arm)*r);
    col.setHSL(0.97 - r/30*0.08, 1, 0.75 - r/30*0.45);
    c.push(col.r, col.g, col.b);
  }
  const d = points(p, c, 0.35); scene.add(d); return d;
})();

/* Agujero negro: esfera negra + anillo brillante */
scene.add(new THREE.Mesh(new THREE.SphereGeometry(3.2, 48, 48), new THREE.MeshBasicMaterial({color:0x000000})));
const ring = new THREE.Mesh(new THREE.RingGeometry(3.3, 4.6, 96),
  new THREE.MeshBasicMaterial({color:0xff4d6d, transparent:true, opacity:.55, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false}));
ring.rotation.x = Math.PI/2; scene.add(ring);

/* Corazón 3D de partículas */
const heart = (() => {
  const p = [], c = [], col = new THREE.Color();
  for (let i = 0; i < 9000; i++) {
    const t = Math.random()*6.283;
    const x = 16*Math.pow(Math.sin(t),3);
    const y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    const s = Math.pow(Math.random(), .5);
    const z = (Math.random()-.5) * 8 * s * (1 - Math.abs(x)/18);
    p.push(x*s*.32, y*s*.32, z);
    col.setHSL(.96 + Math.random()*.03, 1, .55 + Math.random()*.25); c.push(col.r, col.g, col.b);
  }
  const h = points(p, c, 0.28); h.position.y = 9; scene.add(h); return h;
})();

/* Fotos como planetas */
function circle(img, i) {
  const n = 256, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  g.save(); g.beginPath(); g.arc(n/2, n/2, n/2-6, 0, 6.283); g.clip();
  if (img) {
    const m = Math.min(img.width, img.height);
    g.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, n, n);
  } else {
    g.fillStyle = `hsl(${340 + i*8},80%,${35 + (i%4)*8}%)`; g.fillRect(0,0,n,n);
    g.font = '130px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('💖', n/2, n/2+6);
  }
  g.restore();
  g.lineWidth = 8; g.strokeStyle = '#ff8fa3'; g.beginPath(); g.arc(n/2, n/2, n/2-6, 0, 6.283); g.stroke();
  return new THREE.CanvasTexture(c);
}
const planets = [];
FOTOS.forEach((src, i) => {
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map: circle(null, i), transparent:true}));
  const s = 3.6 + Math.random()*1.6; spr.scale.set(s, s, 1);
  const radius = 11 + (i % 4) * 5 + Math.random()*2;
  spr.userData = {src, radius, ang: i/FOTOS.length*6.283, speed: .05 + .25/radius, y: (Math.random()-.5)*4, loaded:false};
  scene.add(spr); planets.push(spr);
  const img = new Image();
  img.onload = () => { spr.material.map = circle(img, i); spr.material.needsUpdate = true; spr.userData.loaded = true; };
  img.src = src;
});

/* Cámara: arrastrar para orbitar, pellizcar/rueda para zoom */
let yaw = 0, pitch = .38, dist = 38, moved = 0, pinch = 0, last = null;
const el = renderer.domElement, pts = new Map();
el.addEventListener('pointerdown', e => { pts.set(e.pointerId, e); last = {x:e.clientX, y:e.clientY}; moved = 0; });
el.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, e);
  if (pts.size === 2) {
    const [a,b] = [...pts.values()], d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if (pinch) dist = Math.min(80, Math.max(15, dist - (d-pinch)*.1));
    pinch = d; moved = 99; return;
  }
  const dx = e.clientX-last.x, dy = e.clientY-last.y; last = {x:e.clientX, y:e.clientY};
  moved += Math.abs(dx)+Math.abs(dy);
  yaw -= dx*.005; pitch = Math.min(1.3, Math.max(-.2, pitch + dy*.004));
});
const up = e => { pts.delete(e.pointerId); pinch = 0; };
el.addEventListener('pointerup', e => { if (moved < 8 && pts.size <= 1) pick(e); up(e); });
el.addEventListener('pointercancel', up);
el.addEventListener('wheel', e => { dist = Math.min(80, Math.max(15, dist + e.deltaY*.02)); });

/* Tocar un planeta -> foto en grande */
const ray = new THREE.Raycaster(), viewer = document.getElementById('viewer'), vimg = viewer.querySelector('img');
function pick(e) {
  ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1), camera);
  const hit = ray.intersectObjects(planets)[0];
  if (!hit) return;
  vimg.src = hit.object.userData.loaded ? hit.object.userData.src : hit.object.material.map.image.toDataURL();
  viewer.classList.add('on');
}
viewer.addEventListener('click', () => viewer.classList.remove('on'));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  disk.rotation.y = t*.04;
  ring.material.opacity = .45 + Math.sin(t*2)*.1;
  heart.scale.setScalar(1 + Math.pow(Math.sin(t*3), 8)*.12); heart.rotation.y = t*.3;
  planets.forEach(p => {
    const d = p.userData, a = d.ang + t*d.speed;
    p.position.set(Math.cos(a)*d.radius, d.y + Math.sin(t+d.ang)*.4, Math.sin(a)*d.radius);
  });
  if (!pts.size) yaw += .0008;
  camera.position.set(Math.sin(yaw)*Math.cos(pitch)*dist, Math.sin(pitch)*dist, Math.cos(yaw)*Math.cos(pitch)*dist);
  camera.lookAt(0, 4, 0);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
