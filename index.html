<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti, Mildred ❤️</title>
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #ff758c;
            --bg-color: #fff0f3;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
        }

        section {
            padding: 2rem 1rem;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Estilo para la sección de galería y las imágenes al 100% */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            padding: 20px 0;
            width: 100%;
            box-sizing: border-box;
        }

        .gallery-item {
            width: 100%;
            height: 300px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Asegura que la foto se vea completa sin deformarse ni recortarse */
            transition: transform 0.3s ease;
        }

        .gallery-item img:hover {
            transform: scale(1.03);
        }

        .audio-player {
            margin: 2rem 0;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Para el amor de mi vida ❤️</h1>
        <p>Cada segundo a tu lado es un regalo</p>
    </header>

    <!-- Reproductor de Música -->
    <section class="audio-player">
        <h2>Nuestra Canción</h2>
        <audio controls autoplay loop>
            <source src="videoplayback.webm" type="audio/webm">
            Tu navegador no soporta el elemento de audio.
        </audio>
    </section>

    <!-- Sección de Galería de Recuerdos -->
    <section id="galeria-recuerdos">
        <h2>Nuestros Recuerdos Juntos</h2>
        <p>Un pequeño recorrido por los momentos que hemos compartido.</p>
        
        <div class="gallery-container">
            <div class="gallery-item">
                <img src="IMG-20210402-WA0030.jpg" alt="Recuerdo especial">
            </div>
            <div class="gallery-item">
                <img src="IMG-20210403-WA0030.jpg" alt="Recuerdo especial">
            </div>
            <div class="gallery-item">
                <img src="IMG-20220601-WA0015.jpg" alt="Recuerdo especial">
            </div>
            <div class="gallery-item">
                <img src="IMG-20220601-WA0016.jpg" alt="Recuerdo especial">
            </div>
            <div class="gallery-item">
                <img src="IMG-20220716-WA0084.jpg" alt="Recuerdo especial">
            </div>
            <div class="gallery-item">
                <img src="IMG-20221205-WA0021.jpg" alt="Recuerdo especial">
            </div>
        </div>
    </section>

    <footer>
        <p>Hecho con todo el amor del mundo para ti 💖</p>
    </footer>

</body>
</html>
